# =============================================================================
# Two ways to run this stack:
#
#   1. Bundled Ollama (default) — brings up its own Ollama container and pulls
#      the configured model automatically:
#
#        docker compose --profile bundled-ollama up -d --build
#
#   2. Existing Ollama — reuses an Ollama you already run on the host, which is
#      the right choice when that instance has GPU access:
#
#        docker compose up -d --build
#
#      Set OLLAMA_URL in .env to reach it. On Linux the Docker bridge gateway is
#      usually http://172.17.0.1:11434; confirm with `ip addr show docker0`. The
#      host Ollama must listen on that address rather than on 127.0.0.1 only.
# =============================================================================

services:
  dashboard:
    build: .
    image: financial-dashboard:latest
    container_name: financial-dashboard
    ports:
      - "${DASHBOARD_PORT:-8050}:8050"
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-120}
      TZ: ${TZ:-UTC}
      CURRENCY: ${CURRENCY:-BRL}
      CURRENCY_SYMBOL: ${CURRENCY_SYMBOL:-R$$}
      REQUEST_PASSWORD: ${REQUEST_PASSWORD:-0}
      DASHBOARD_USERS: ${DASHBOARD_USERS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Backups. BACKUP_DIR empty means ./data/backups; to use another drive,
      # set it to a container path and mount that path below.
      BACKUP_DIR: ${BACKUP_DIR:-}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_SCHEDULED: ${BACKUP_KEEP_SCHEDULED:-14}
      BACKUP_SAFETY_MIN_MINUTES: ${BACKUP_SAFETY_MIN_MINUTES:-60}
      BACKUP_KEEP_SAFETY: ${BACKUP_KEEP_SAFETY:-20}
    volumes:
      # The database and its backups live on the host, outside the container
      # lifecycle. Keep this on a local disk: SQLite's WAL mode does not work
      # over NFS/SMB.
      - ./data:/app/data
      # To keep backups on another drive, mount it and set BACKUP_DIR to it:
      # - /mnt/other-disk/dashboard-backups:/backups
    # Lets the container reach a host service as host.docker.internal on Linux
    # as well, which is an alternative to the bridge gateway address.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Optional services, only started with: --profile bundled-ollama
  # --------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    profiles: ["bundled-ollama"]
    volumes:
      - ollama:/root/.ollama
    # Uncomment to give the bundled Ollama access to an NVIDIA GPU. Requires the
    # NVIDIA Container Toolkit on the host; without this block it runs on CPU.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  model-puller:
    image: ollama/ollama:latest
    container_name: ollama-model-puller
    profiles: ["bundled-ollama"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        MODEL="${OLLAMA_MODEL:-llama3.2:3b}"
        echo "Pulling model: $$MODEL"
        ollama pull "$$MODEL" && echo "Model ready." || echo "Pull failed; it may already exist."
    restart: "no"

volumes:
  ollama: